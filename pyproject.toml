[project]
name = "awesome-claude"
version = "0.1.0"
description = "Generate project-specific Claude Code kits and starter documents from this repo's templates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.scripts]
awesome-claude = "awesome_claude.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's argument-default pattern (`x: T = typer.Option(...)`) is the
# framework's documented API, not the mutable-default-argument bug B008
# guards against - typer.Option()/Argument() build lightweight metadata
# objects, not the accidental-shared-state footgun the rule targets.
"src/awesome_claude/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_claude"]
