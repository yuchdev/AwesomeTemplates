# Model policy: how strictly the generator treats an outdated `model:` pin.
#
# The model DATA - recommended IDs per vendor, agent roles and tiers, upgrade targets, API key env var
# names, and the cached list of models each vendor serves - moved out of this file into models.json:
#   seed (versioned, edit this to retire/adopt a model):  src/awesome_templates/data/models.template.json
#   per-user copy (created by `awesome-templates init`):   ~/.local/state/awesome/models.json
# Read by src/awesome_templates/model_policy.py. If you add a `[recommended]` table here the file becomes
# a self-contained policy and models.json is ignored (used by tests and for pinning a project's own set).
#
# mode = "off"   - no check
# mode = "warn"  - `generate` reports outdated pins in its warnings and carries on
# mode = "error" - `generate` refuses to write anything while an agent it would copy is outdated
mode = "warn"

[live]
# `init` and `check-models --live` reuse the cached vendor lists in models.json when they are younger
# than this, and make no request. `init --refresh` ignores it.
max_age_hours = 24
